name: qexmanage_pos
description: "SmartScan Multi-Store Manager - Smart POS & Inventory Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation & Routing
  go_router: ^14.2.0

  # Local Storage & Database (Offline-First)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Network & API
  dio: ^5.4.3+1
  http: ^1.2.1

  # Barcode & Camera Scanner
  mobile_scanner: ^5.1.1

  # Hardware & Bluetooth Thermal Printing (ESC/POS)
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.1
  flutter_bluetooth_serial: ^0.4.0

  # PDF, Printing & Sharing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # QR Code Rendering (UPI Payment)
  qr_flutter: ^4.1.0

  # UI, Fonts & Formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
