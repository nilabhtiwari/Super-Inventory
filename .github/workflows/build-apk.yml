name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-inventory-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Super Inventory App v1.0.${{ github.run_number }}
          body: |
            ## Super Inventory Android App Release 🚀
            
            Download the APK directly to your mobile phone:
            - **[app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-release.apk)**
            
            ### Installation Instructions:
            1. Download `app-release.apk` on your Android device.
            2. Tap the downloaded file to install.
            3. If prompted, allow "Install from unknown sources" in settings.
            4. Open Super Inventory and log in!
          draft: false
          prerelease: false
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
