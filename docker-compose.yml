version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: qexmanage_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: qexmanage_pos
      MYSQL_USER: qexmanage
      MYSQL_PASSWORD: qexmanage_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+05:30'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'qexmanage', '-pqexmanage_pass']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qexmanage_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs

volumes:
  mysql_data:
